<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexión</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #030712; color: #e5e7eb; font-family: system-ui, sans-serif; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #9ca3af; max-width: 420px; }
    button { margin-top: 16px; background: #c8202a; color: #fff; border: 0; border-radius: 999px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>No hay conexión con el sistema</h1>
    <p>Revisa el internet de esta computadora. Se vuelve a intentar sola cada 10 segundos.</p>
    <p id="detail" style="font-size:12px"></p>
    <button id="retry" type="button">Reintentar ahora</button>
    <p><a id="settings" href="setup.html" style="color:#9ca3af">Cambiar la dirección o las impresoras</a></p>
  </div>
  <script src="offline.js"></script>
</body>
</html>
