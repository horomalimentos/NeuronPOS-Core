# nginx para NeuronPOS Core (plataforma multi-restaurante).
#
# Va en /etc/nginx/sites-available/neuronpos y se enlaza en sites-enabled.
# Es un bloque aparte del de Horom: no toca horomemp.com ni horomsushi.com.
#
# - neuronpos.mx            -> la plataforma (Panel NeuronPOS en /panel)
# - <slug>.neuronpos.mx     -> el sitio, portal y POS de cada restaurante
# - dominios propios        -> se agregan en el bloque "dominios propios"
#
# El backend resuelve el restaurante por el Host, por eso siempre se manda
# `proxy_set_header Host $host`.

upstream neuronpos_core {
    server 127.0.0.1:8100;
    keepalive 16;
}

# HTTP -> HTTPS (deja pasar el reto de certbot para dominios propios)
server {
    listen 80;
    listen [::]:80;
    server_name neuronpos.mx www.neuronpos.mx *.neuronpos.mx;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# www -> dominio raiz
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.neuronpos.mx;

    ssl_certificate     /etc/letsencrypt/live/neuronpos.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neuronpos.mx/privkey.pem;

    return 301 https://neuronpos.mx$request_uri;
}

# Plataforma y subdominios de los restaurantes
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name neuronpos.mx *.neuronpos.mx;

    # Certificado comodin (neuronpos.mx + *.neuronpos.mx), ver README.
    ssl_certificate     /etc/letsencrypt/live/neuronpos.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neuronpos.mx/privkey.pem;

    include /etc/nginx/snippets/neuronpos-app.conf;
}

# Dominios propios de restaurantes: copia este bloque por cada uno, con su
# propio certificado (certbot --nginx -d turestaurante.com -d www.turestaurante.com)
# y registra el dominio en el Panel (campo "dominio propio" del restaurante).
