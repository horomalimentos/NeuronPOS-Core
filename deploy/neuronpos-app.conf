# Snippet comun: va en /etc/nginx/snippets/neuronpos-app.conf
# Sirve el frontend compilado y manda /api al backend conservando el Host.

root /opt/neuronpos-core/frontend/dist;
index index.html;

client_max_body_size 10m;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

location /api/ {
    proxy_pass http://neuronpos_core;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# SPA: cualquier otra ruta la resuelve React
location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
